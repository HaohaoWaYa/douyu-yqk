name: 更新斗鱼直播源 M3U

on:
  schedule:
    # 每 25 分钟运行一次 (UTC)
    - cron: '*/25 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main, master]
    paths:
      - 'generator.py'

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js（execjs 依赖）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          pip install requests PyExecJS

      - name: 验证环境
        run: |
          echo "=== Python ==="
          python --version
          echo "=== Node.js ==="
          node --version
          echo "=== execjs test ==="
          python -c "import execjs; print('execjs OK, runtime:', execjs.get().name)"

      - name: 生成直播源 M3U
        run: |
          python generator.py --direct --max-rooms 120 -o douyu_yqk.m3u
        timeout-minutes: 15

      - name: 显示生成结果
        run: |
          echo "=== M3U 统计 ==="
          wc -l douyu_yqk.m3u
          echo "=== 频道数 ==="
          grep -c "#EXTINF" douyu_yqk.m3u || echo "0"
          echo "=== 文件大小 ==="
          ls -lh douyu_yqk.m3u
          echo "=== 生成时间 ==="
          date '+%Y-%m-%d %H:%M:%S'

      - name: 准备 Pages 发布目录
        run: |
          mkdir -p public
          cp douyu_yqk.m3u public/
          cp index.html public/ 2>/dev/null || true

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🔄 自动更新直播源 [skip ci]'
