<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗鱼一起看 - 直播源</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f7;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  h1 { color: #e65100; margin: 0 0 8px; font-size: 22px; }
  h2 { font-size: 15px; color: #555; margin: 16px 0 8px; border-left: 3px solid #e65100; padding-left: 10px; }
  .url-box {
    background: #f0f7ff;
    border: 1px solid #b3d9ff;
    padding: 12px 16px;
    border-radius: 8px;
    word-break: break-all;
    font-size: 14px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    user-select: all;
  }
  .status { color: #888; font-size: 13px; margin-top: 8px; }
  .note {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #795548;
    margin-top: 16px;
  }
  .step { margin: 6px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>🐟 斗鱼「一起看」直播源</h1>
  <p style="color:#888;font-size:14px;margin:0;">
    自动采集斗鱼一起看分区直播房间，每 25 分钟更新
  </p>
</div>

<div class="card">
  <h2>📺 M3U 订阅地址（添加到电视/播放器）</h2>
  <div class="url-box" id="m3uUrl">loading...</div>
  <p class="status" id="meta">更新中...</p>
</div>

<div class="card">
  <h2>📋 使用方法</h2>
  <p class="step">1. 复制上方 M3U 订阅地址</p>
  <p class="step">2. 在电视 IPTV 播放器的「列表订阅」中粘贴</p>
  <p class="step">3. 保存后即可看到斗鱼一起看的频道列表</p>
</div>

<div class="note">
  ⚠️ 注意：此方法使用斗鱼 CDN 直链，HLS 地址约 1-2 小时过期。播放器需要定期刷新 M3U 列表以获取最新地址。
</div>

<p style="text-align:center;color:#bbb;font-size:12px;margin-top:24px;">
  Generated by GitHub Actions · Powered by Cloudflare
</p>

<script>
  const base = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '');
  document.getElementById('m3uUrl').textContent = base + '/douyu_yqk.m3u';

  // 尝试加载 M3U 获取元信息
  fetch(base + '/douyu_yqk.m3u')
    .then(r => r.text())
    .then(text => {
      const lines = text.split('\n');
      const extinf = lines.filter(l => l.startsWith('#EXTINF'));
      const channels = extinf.filter(l => l.includes('group-title='));
      let info = '';
      if (channels.length > 0) {
        const last = channels[channels.length - 1];
        const nameMatch = last.match(/group-title="douyu-yqk",(.+)/);
        info = `频道数: ${channels.length} | 最新频道: ${nameMatch ? nameMatch[1] : '-'}`;
      } else {
        info = `频道数: ${extinf.length}`;
      }
      // 提取注释中的更新时间
      const commentLine = lines.find(l => l.startsWith('# 更新时间:'));
      if (commentLine) info += ' | ' + commentLine;
      document.getElementById('meta').textContent = info;
    })
    .catch(() => {
      document.getElementById('meta').textContent = '暂无数据';
    });
</script>
</body>
</html>
